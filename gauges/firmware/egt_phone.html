<!doctype html>
<html lang="en">
<!-- Truck EGT gauge v7 - phone page (Web Bluetooth, Chrome on Android). Single file, no internet needed after load.
     Open over https:// (e.g. GitHub Pages) or http://localhost; Chrome only allows Bluetooth on secure pages. -->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EGT Gauge</title>
<style>
  body { margin: 0; background: #000; color: #fff; font: 18px/1.3 system-ui, sans-serif; text-align: center; }
  button { font: inherit; font-weight: 700; padding: 12px 18px; margin: 6px; border: 2px solid #fff; background: #000; color: #fff; border-radius: 8px; }
  button:active { background: #fff; color: #000; }
  #status { margin: 6px; min-height: 1.3em; }
  canvas { display: block; margin: 8px auto; max-width: 100%; }
  table { margin: 8px auto 24px; border-collapse: collapse; font-size: 15px; }
  td, th { border: 1px solid #fff; padding: 4px 7px; }
  h2 { font-size: 18px; margin: 18px 0 4px; }
  .sel { background: #fff; color: #000; }
</style>
</head>
<body>
<button id="connect">CONNECT</button>
<div id="status">Not connected</div>
<canvas id="gauge" width="320" height="320"></canvas>
<div id="flags"></div>
<h2>HISTORY</h2>
<div id="win"></div>
<canvas id="hist" width="340" height="190"></canvas>
<button id="loadHist">REFRESH HISTORY</button>
<h2>DRIVE LOG</h2>
<button id="loadLog">REFRESH LOG</button>
<table id="log"></table>
<script>
'use strict';
// Must match egt_gauge.ino
const SVC  = 'd71c5700-b298-4fbf-911d-f4ed8b480e08';
const LIVE = 'd71c5701-b298-4fbf-911d-f4ed8b480e08';
const CTRL = 'd71c5702-b298-4fbf-911d-f4ed8b480e08';
const DATA = 'd71c5703-b298-4fbf-911d-f4ed8b480e08';
// Pure primaries only (same as the gauge)
const GREEN = '#00ff00', YELLOW = '#ffff00', RED = '#ff0000', BLACK = '#000000', WHITE = '#ffffff';

let dev, chLive, chCtrl, chData, live = null, busy = false, blink = true;
let hist = new Map();          // seq -> deg F
let newestSeq = 0, winMin = 30;
const $ = id => document.getElementById(id);

function status(s) { $('status').textContent = s; }

$('connect').onclick = async () => {
  try {
    if (!navigator.bluetooth) { status('This browser has no Web Bluetooth. Use Chrome on Android.'); return; }
    dev = await navigator.bluetooth.requestDevice({ filters: [{ services: [SVC] }] });
    dev.addEventListener('gattserverdisconnected', () => { status('Disconnected - tap CONNECT'); });
    status('Connecting...');
    const srv = await dev.gatt.connect();
    const svc = await srv.getPrimaryService(SVC);
    chLive = await svc.getCharacteristic(LIVE);
    chCtrl = await svc.getCharacteristic(CTRL);
    chData = await svc.getCharacteristic(DATA);
    chLive.addEventListener('characteristicvaluechanged', e => onLive(e.target.value));
    await chLive.startNotifications();
    onLive(await chLive.readValue());
    status('Connected to ' + (dev.name || 'EGT Gauge'));
    await loadHistory(); await loadLog();
  } catch (e) { status('Error: ' + e.message); }
};

function onLive(v) {
  if (v.byteLength < 16) return;
  live = {
    band: v.getUint8(1), flags: v.getUint8(2), light: v.getUint8(3),
    egt: v.getInt16(4, true), peak: v.getInt16(6, true),
    hot: v.getUint16(8, true), high: v.getUint16(10, true), danger: v.getUint16(12, true), cool: v.getUint16(14, true)
  };
  const f = live.flags, t = [];
  if (f & 16) t.push('NO PROBE');
  if (f & 1) t.push(f & 2 ? 'DANGER (MUTED)' : 'DANGER ALARM');
  if (f & 4) t.push('COOL DOWN');
  if (f & 8) t.push('OK TO SHUT OFF');
  t.push(f & 32 ? 'NIGHT' : 'DAY');
  t.push('BUZZER ' + (f & 64 ? 'ON' : 'OFF'));
  $('flags').textContent = 'LIVE ' + live.egt + ' F  |  ' + t.join('  |  ');
  drawGauge();
}

// ---- gauge: same layout as the round screen ----
function drawGauge() {
  const c = $('gauge'), g = c.getContext('2d'), S = c.width / 240;
  g.setTransform(S, 0, 0, S, 0, 0);
  g.fillStyle = BLACK; g.fillRect(0, 0, 240, 240);
  g.save(); g.beginPath(); g.arc(120, 120, 120, 0, 2 * Math.PI); g.clip();
  if (!live) { g.fillStyle = BLACK; g.fillRect(0, 0, 240, 240); g.restore(); return; }
  const fault = live.band === 255;
  let bg = fault ? BLACK : live.band === 3 ? (blink ? RED : BLACK) : live.band === 2 ? RED : live.band === 1 ? YELLOW : GREEN;
  const fg = (bg === GREEN || bg === YELLOW) ? BLACK : WHITE;
  g.fillStyle = bg; g.fillRect(0, 0, 240, 240);
  g.fillStyle = fg; g.strokeStyle = fg; g.textAlign = 'center'; g.textBaseline = 'middle';
  if (fault) { g.font = 'bold 44px monospace'; g.fillText('NO', 120, 95); g.fillText('PROBE', 120, 145); g.restore(); return; }
  const ang = f => (225 - 270 * Math.min(Math.max(f, 0), 2400) / 2400) * Math.PI / 180;
  const n = Math.min(24, Math.max(0, Math.ceil(live.egt / 100 - 1e-6)));
  const pkSeg = Math.max(Math.ceil(live.peak / 100 - 1e-6) - 1, 0);
  for (let k = 0; k < 24; k++) {
    const a0 = ang(k * 100) - 1.5 * Math.PI / 180, a1 = ang((k + 1) * 100) + 1.5 * Math.PI / 180;
    g.beginPath(); g.arc(120, 120, 112, -a0, -a1); g.arc(120, 120, 94, -a1, -a0, true); g.closePath();
    if (k < n || (k === pkSeg && live.peak > 0)) g.fill();
    g.lineWidth = 1; g.stroke();
  }
  const a = ang(live.peak), d = 4 * Math.PI / 180;           // peak wedge
  g.beginPath(); g.moveTo(120 + 113 * Math.cos(a), 120 - 113 * Math.sin(a));
  g.lineTo(120 + 120 * Math.cos(a - d), 120 - 120 * Math.sin(a - d)); g.lineTo(120 + 120 * Math.cos(a + d), 120 - 120 * Math.sin(a + d)); g.fill();
  g.font = 'bold 15px monospace';
  for (let f = 0; f <= 2400; f += 400) g.fillText(String(f / 100), 120 + 80 * Math.cos(ang(f)), 120 - 80 * Math.sin(ang(f)));
  g.font = '9px monospace'; g.fillText('x100 F', 120, 175);
  g.font = 'bold 46px monospace'; g.fillText(String(live.peak), 120, 114);
  g.font = 'bold 15px monospace'; g.fillText('PEAK F', 120, 149);
  const f = live.flags; let cue = null;
  if (f & 1) cue = (f & 2) ? ['MUTED'] : null; else if (f & 4) cue = ['COOL', 'DOWN']; else if (f & 8) cue = ['OK TO', 'SHUT OFF'];
  if (cue) {
    g.fillRect(70, 186, 100, 36); g.fillStyle = bg; g.font = 'bold 15px monospace';
    if (cue.length === 1) g.fillText(cue[0], 120, 204); else { g.fillText(cue[0], 120, 196); g.fillText(cue[1], 120, 212); }
  }
  g.restore();
}
setInterval(() => { blink = !blink; if (live && live.band === 3) drawGauge(); }, 250);

// ---- history: CTRL [1][u16 ageOffset] -> DATA [1][n][u16 total][u32 seqNewest][u16 off][n x i16 newest-first] ----
async function request(cmd, off) {
  await chCtrl.writeValue(new Uint8Array([cmd, off & 255, off >> 8]));
  return await chData.readValue();
}
async function loadHistory() {
  if (!chCtrl || busy) return; busy = true;
  try {
    let off = 0, total = 1;
    while (off < total) {
      const v = await request(1, off);
      if (v.getUint8(0) !== 1) break;
      const n = v.getUint8(1); total = v.getUint16(2, true);
      const seq = v.getUint32(4, true), o = v.getUint16(8, true);
      newestSeq = Math.max(newestSeq, seq);
      for (let i = 0; i < n; i++) hist.set(seq - (o + i), v.getInt16(10 + 2 * i, true));
      if (n === 0) break;
      off += n;
    }
    for (const k of hist.keys()) if (k <= newestSeq - 1800) hist.delete(k);
    drawHist();
  } catch (e) { status('History error: ' + e.message); }
  busy = false;
}
function drawWinButtons() {
  $('win').innerHTML = '';
  for (const m of [5, 10, 15, 30]) {
    const b = document.createElement('button'); b.textContent = m + ' MIN';
    if (m === winMin) b.className = 'sel';
    b.onclick = () => { winMin = m; drawWinButtons(); drawHist(); };
    $('win').appendChild(b);
  }
}
function drawHist() {
  const c = $('hist'), g = c.getContext('2d'), W = c.width, H = c.height, X0 = 44, Y0 = 8, w = W - X0 - 6, h = H - 34;
  g.fillStyle = BLACK; g.fillRect(0, 0, W, H);
  const win = winMin * 60, pts = [];
  for (let age = win - 1; age >= 0; age--) { const v = hist.get(newestSeq - age); if (v !== undefined) pts.push([age, v]); }
  const pk = pts.reduce((m, p) => Math.max(m, p[1]), 0);
  const dz = live ? live.danger : 1600; let hi = Math.max(dz + 200, 400); if (pk > hi) hi = pk + 100;
  const y = v => Y0 + h - v * h / hi, x = age => X0 + w - age * w / win;
  g.strokeStyle = WHITE; g.strokeRect(X0, Y0, w, h);
  g.fillStyle = WHITE; g.font = '12px monospace'; g.textAlign = 'right'; g.textBaseline = 'middle';
  for (let v = 0; v <= hi; v += 500) { g.fillText(String(v), X0 - 4, y(v)); }
  if (live) for (const [t, col] of [[live.hot, YELLOW], [live.high, RED], [live.danger, RED]]) { g.strokeStyle = col; g.lineWidth = 2; g.beginPath(); g.moveTo(X0, y(t)); g.lineTo(X0 + w, y(t)); g.stroke(); }
  g.strokeStyle = WHITE; g.lineWidth = 2; g.beginPath();
  pts.forEach((p, i) => i ? g.lineTo(x(p[0]), y(p[1])) : g.moveTo(x(p[0]), y(p[1]))); g.stroke(); g.lineWidth = 1;
  g.textAlign = 'center'; g.font = 'bold 14px monospace';
  g.fillText('LAST ' + winMin + ' MIN   PEAK ' + pk + ' F', W / 2, H - 12);
}

// ---- log: CTRL [2] -> DATA [2][count][u16 driveNum][count x 22-byte records], entry 0 = this drive ----
const mmss = s => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
async function loadLog() {
  if (!chCtrl || busy) return; busy = true;
  try {
    const v = await request(2, 0);
    if (v.getUint8(0) === 2) {
      const cnt = v.getUint8(1);
      let html = '<tr><th>DRIVE</th><th>MAX F</th><th>RUN</th><th>&gt;HIGH</th><th>&gt;DANGER</th><th>TOP PEAKS</th></tr>';
      for (let k = 0; k < cnt; k++) {
        const b = 4 + k * 22, u = i => v.getUint16(b + 2 * i, true);
        const peaks = [0, 1, 2].filter(j => u(5 + j)).map(j => u(5 + j) + ' F / ' + mmss(u(8 + j))).join('<br>') || 'NONE';
        html += `<tr><td>${k ? u(0) : 'THIS (' + u(0) + ')'}</td><td>${u(1)}</td><td>${u(2)} MIN</td><td>${mmss(u(3))}</td><td>${mmss(u(4))}</td><td>${peaks}</td></tr>`;
      }
      $('log').innerHTML = html;
    }
  } catch (e) { status('Log error: ' + e.message); }
  busy = false;
}
$('loadHist').onclick = loadHistory;
$('loadLog').onclick = loadLog;
setInterval(() => { if (dev && dev.gatt.connected) loadHistory(); }, 30000);
drawWinButtons(); drawGauge(); drawHist();
// Open with #demo to preview the page with made-up numbers (no Bluetooth).
if (location.hash === '#demo') {
  const b = new DataView(new ArrayBuffer(16)); [1, 0, 4, 60].forEach((x, i) => b.setUint8(i, x));
  [640, 1380, 1200, 1400, 1600, 300].forEach((x, i) => b.setUint16(4 + 2 * i, x, true)); onLive(b);
  newestSeq = 1800; for (let i = 0; i < 1800; i++) hist.set(i + 1, Math.round(820 + 60 * Math.sin(i / 37) + (i > 1420 && i < 1480 ? 820 * Math.sin((i - 1420) / 60 * Math.PI) : 0)));
  drawHist(); status('DEMO - not connected');
}
</script>
</body>
</html>
